name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/metrics.yml, .github/scripts/**]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # METRICS_TOKEN needs the `repo` scope so private repositories and contributions are counted.
      # Only aggregated numbers are rendered - no private repository names.
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: TgMrP
          template: classic
          base: header, repositories
          config_timezone: Asia/Jerusalem
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, scss, sass, shell, dockerfile, makefile, powershell
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # All-time totals (PRs, reviews, commits) - lowlighter only counts the last year.
      - uses: actions/checkout@v4
      - run: node .github/scripts/stats.mjs
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
      - name: Commit stats card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.stats.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update stats card"
          git pull --rebase
          git push
