name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/metrics.yml, .github/scripts/**]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # METRICS_TOKEN needs the `repo` scope so private repositories and contributions are counted.
      # Only aggregated numbers are rendered - no private repository names.
      # Own script instead of lowlighter/metrics: lowlighter only counts the last year, its languages, habits and
      # achievements sections error out, and its streak disagreed with the calendar.
      - uses: actions/checkout@v4
      - run: node .github/scripts/stats.mjs
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
      - name: Commit stats cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.stats.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update stats card"
          git pull --rebase
          git push
