name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/metrics.yml, .github/scripts/**]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # METRICS_TOKEN needs the `repo` scope so private repositories and contributions are counted.
      # Only aggregated numbers are rendered - no private repository names.
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: TgMrP
          template: classic
          # The "repositories" section only showed zeroes (stars, forks, sponsors, license) - header only.
          base: header
          config_timezone: Asia/Jerusalem
          config_twemoji: yes
          repositories_affiliations: owner, collaborator, organization_member
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: no
          plugin_habits_from: 400
          plugin_habits_days: 30
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          plugin_achievements_secrets: no

      # All-time totals, streak and languages - lowlighter only counts the last year, its languages list renders empty
      # and the public streak service times out behind GitHub's image proxy.
      - uses: actions/checkout@v4
      - run: node .github/scripts/stats.mjs
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
      - name: Commit stats cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.stats.svg metrics.streak.svg metrics.languages.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update stats cards"
          git pull --rebase
          git push
